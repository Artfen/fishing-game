<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fish studio</title>
<style>
  html, body { margin: 0; height: 100%; background: #33505c; color: #e9eef0; font: 14px system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; }
  #label { position: fixed; left: 12px; top: 10px; white-space: pre; text-shadow: 0 1px 2px #000; }
</style>
</head>
<body>
<div id="label"></div>
<!-- Each fish's own looks (docs/FISH.md): a row of one kind, each with its own shade, spots and
     scars, and (morphs=1) each colour morph after them. Side on, the same size, so they compare.
     tools/fishstudio.html?sp=trout&n=5&morphs=1 (also &scars=1 for every one scarred). -->
<script type="importmap">
{ "imports": { "three": "../vendor/three/three.module.min.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { fishById, buildFishMesh, setLook } from '../src/fish.js';
import { lookOf, MORPHS, morphsFor } from '../src/fishlook.js';

const q = new URLSearchParams(location.search);
const sp = fishById[q.get('sp') || 'trout'], n = +(q.get('n') || 5), withMorphs = q.get('morphs') === '1', scars = q.get('scars') === '1';
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#33505c');
scene.add(new THREE.HemisphereLight('#dff2ff', '#3a4a40', 1.4));
const sun = new THREE.DirectionalLight('#fff6e8', 2.2);
sun.position.set(0.4, 2, 1.2);
scene.add(sun);

const rows = [];
for (let i = 0; i < n; i++) {
  const look = lookOf(sp, sp.size[1], 1000 + i * 7);
  look[2] = 0;
  if (scars) look[3] = 0.15 + 0.8 * (i / Math.max(1, n - 1));
  rows.push({ look, label: `#${i + 1}` });
}
if (withMorphs) {
  for (const [name] of Object.entries(morphsFor(sp))) {
    const look = lookOf(sp, sp.size[1], 99);
    look[2] = MORPHS.indexOf(name);
    look[3] = 0;
    rows.push({ look, label: name });
  }
}
const cols = Math.min(rows.length, 4), H = 0.42;
rows.forEach((r, i) => {
  const m = buildFishMesh(sp);
  m.visible = true;
  setLook(m, r.look);
  const c = i % cols, w = Math.floor(i / cols);
  m.position.set((c - (cols - 1) / 2) * 1.4, -w * H, 0);
  m.rotation.y = -Math.PI / 2;
  // (A flatfish from above, its eyed side to you.)
  if (sp.sketch?.flat || sp.life?.flat) m.rotation.x = Math.PI / 2;
  scene.add(m);
});
const rowsN = Math.ceil(rows.length / cols);
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 50);
cam.position.set(0, -((rowsN - 1) * H) / 2 + 0.05, 1.3 + cols * 0.62);
cam.lookAt(0, -((rowsN - 1) * H) / 2, 0);
renderer.render(scene, cam);
document.getElementById('label').textContent = `${sp.name}\n${rows.map((r) => r.label).join('  ·  ')}`;
window.studioReady = true;
</script>
</body>
</html>
